plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version "2.4.0"
    id("com.github.johnrengelman.shadow") version "7.0.0"
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
}

shadowJar {
    archiveClassifier.set("fat")
}

group = 'ru.batr'
version = '1.4'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:26.1.2.build.+"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation 'org.jetbrains.exposed:exposed-core:0.53.0'
    implementation 'org.jetbrains.exposed:exposed-crypt:0.53.0'
    implementation 'org.jetbrains.exposed:exposed-dao:0.53.0'
    implementation 'org.jetbrains.exposed:exposed-jdbc:0.53.0'

    implementation 'org.jetbrains.exposed:exposed-kotlin-datetime:0.53.0'

    implementation 'org.jetbrains.exposed:exposed-json:0.53.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0-RC.2")
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
kotlin {
    jvmToolchain(25)
}
